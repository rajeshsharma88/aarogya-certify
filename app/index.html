<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Meta (Facebook) domain verification.

      Proves to Meta that this domain belongs to the business, which is what
      lets the Business Manager account control link editing and run ads
      pointing here. Meta re-checks it periodically, so it must stay in the
      served HTML — removing it later un-verifies the domain.

      It must be on the page Meta fetches at the apex: https://aarogyaindiagurukul.com/
      This is a single-page app, so every route serves this same index.html.
    -->
    <meta name="facebook-domain-verification" content="jqvpvhh5d9akezejbm6kcecs1b6wj0" />

    <title>Aarogya India Gurukul — Ayurveda Certifications</title>
    <meta
      name="description"
      content="Free, timed assessments in Panchkarma, Marma therapy, Ayurvedic nutrition and herbal medicine. Pass and receive a certificate with a unique ID anyone can verify."
    />

    <!--
      Open Graph and Twitter cards. These control the preview shown when a link
      is posted to Meta, WhatsApp or LinkedIn, so a campaign driving traffic here
      depends on them. The absolute URLs must match the domain actually served:
      update both if the site moves.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aarogya India Gurukul" />
    <meta property="og:title" content="Aarogya India Gurukul — Ayurveda Certifications" />
    <meta
      property="og:description"
      content="Free, timed assessments in Panchkarma, Marma therapy, Ayurvedic nutrition and herbal medicine. Pass and receive a verifiable certificate."
    />
    <meta property="og:url" content="https://aarogyaindiagurukul.com/" />
    <meta property="og:image" content="https://aarogyaindiagurukul.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
